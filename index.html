<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仙魔异世录：硬核修仙开源世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .glass-bg {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center p-2 sm:p-4" style="background-image: url('https://img.paulzzh.com/touhou/random?v=1'); background-size: cover; background-position: center; background-attachment: fixed;">

    <!-- 顶栏 -->
    <header class="w-full max-w-6xl glass-bg border border-slate-700 rounded-t-xl p-4 shadow-xl z-10 flex justify-between items-center sticky top-0">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-200 tracking-wider">
            🌌 仙魔异世录：硬核开放世界
        </h1>
        <div class="flex items-center gap-3 flex-wrap">
            <input type="password" id="apiKey" placeholder="在此粘贴 Gemini API Key" class="bg-slate-800 border border-slate-600 text-sm px-3 py-2 rounded-lg text-slate-200 w-48 sm:w-64 focus:outline-none focus:ring-2 focus:ring-amber-500">
            <button onclick="toggleBackpack()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-1.5 shadow">
                📦 随身背包 <span id="pill-count-badge" class="bg-red-600 text-xs px-2 py-0.5 rounded-full">1/3</span>
            </button>
            <button onclick="saveGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-bold transition">💾 手动存档</button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="w-full max-w-6xl glass-bg rounded-b-xl shadow-2xl flex flex-col lg:flex-row flex-grow border border-t-0 border-slate-700 overflow-hidden">
        
        <!-- 左侧角色与属性面板 -->
        <aside class="lg:w-80 border-r border-slate-700 p-4 flex flex-col gap-4 bg-slate-900/60">
            <div class="flex flex-col items-center gap-2 p-4 rounded-xl bg-slate-900/90 border border-slate-600 shadow-inner">
                <div class="w-24 h-24 rounded-full border-2 border-amber-500 overflow-hidden bg-slate-800 shadow relative">
                    <img id="player-avatar" src="https://api.dicebear.com/8.x/notionists-neutral/svg?seed=default" class="w-full h-full object-cover">
                </div>
                <div class="text-center">
                    <div id="ui-id" class="text-base font-bold text-amber-300">（主人）</div>
                    <div class="flex justify-center gap-1 mt-1">
                        <span id="ui-faction" class="text-xs text-cyan-300 bg-cyan-950 px-2.5 py-0.5 rounded-full border border-cyan-800">东方修仙</span>
                        <span id="ui-moral" class="text-xs text-yellow-300 bg-yellow-950 px-2 py-0.5 rounded-full border border-yellow-800">黄名侠士</span>
                    </div>
                </div>
            </div>

            <!-- 数值与装备栏 -->
            <div class="space-y-2.5 text-sm">
                <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 flex justify-between"><span>境界/等级</span><span id="ui-level" class="text-emerald-400 font-bold">Lv.1 练气初期</span></div>
                <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 flex justify-between"><span>随身碎银</span><span id="ui-money" class="text-amber-400 font-bold">100两</span></div>
                
                <!-- 条形属性 -->
                <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 space-y-1">
                    <div class="flex justify-between"><span>气血 (HP)</span><span id="ui-hp" class="text-red-400 font-bold">100/100</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded overflow-hidden"><div id="hp-bar" class="bg-red-600 h-full w-full transition-all"></div></div>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 space-y-1">
                    <div class="flex justify-between"><span>真气 (MP)</span><span id="ui-blue" class="text-blue-400 font-bold">50/50</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded overflow-hidden"><div id="mp-bar" class="bg-blue-600 h-full w-full transition-all"></div></div>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 space-y-1">
                    <div class="flex justify-between"><span>体力 (AP)</span><span id="ui-ap" class="text-yellow-400 font-bold">10/10</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded overflow-hidden"><div id="ap-bar" class="bg-yellow-500 h-full w-full transition-all"></div></div>
                </div>

                <!-- 装备与职业栏 -->
                <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-700 space-y-1.5 text-xs">
                    <div class="text-amber-400 font-bold border-b border-slate-800 pb-1">🛡️ 装备与职业状态</div>
                    <div class="flex justify-between"><span>武器:</span> <span id="eq-weapon" class="text-slate-300">新手铁剑(未绑定)</span></div>
                    <div class="flex justify-between"><span>护甲:</span> <span id="eq-armor" class="text-slate-300">布衣(无)</span></div>
                    <div class="flex justify-between"><span>裤鞋:</span> <span id="eq-pants" class="text-slate-300">粗布裤鞋</span></div>
                    <div class="flex justify-between"><span>戒指:</span> <span id="eq-ring" class="text-slate-300">无 / 无 / 无</span></div>
                    <div class="flex justify-between"><span>副职业:</span> <span id="ui-jobs" class="text-cyan-400 font-bold">无 (18级解锁)</span></div>
                </div>
            </div>
        </aside>

        <!-- 右侧主剧情与互动视窗 -->
        <section class="flex-grow flex flex-col bg-slate-950/70">
            <!-- 故事输出框 -->
            <div id="story-box" class="flex-grow p-5 space-y-4 overflow-y-auto text-slate-100 text-base leading-loose max-h-[550px]">
                <div class="bg-slate-900/90 border border-amber-500/40 p-4 rounded-xl shadow">
                    <div class="text-amber-400 font-bold text-sm mb-1">【硬核世界主脑提示】</div>
                    欢迎来到仙魔异世录！本世界融合东方修仙、动态副职业、ID装备绑定、红名阵营与跨城10道生死路考。请在上方输入你的 **Gemini API Key**，然后点击下方按钮开始创建你的专属角色！
                </div>
            </div>

            <!-- 动态选项与自由输入区域 -->
            <footer class="bg-slate-900 border-t border-slate-700 p-4">
                <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <button onclick="openCharacterCreation()" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white p-3 rounded-xl text-center text-base font-bold transition shadow col-span-2">
                        ✨ 点击此处开始：创建角色、选择阵营、踏入仙途 ✨
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="custom-input" placeholder="输入任意自由行动（如：打开背包、就地打坐、四处搜刮、前往坊市...）" class="flex-grow bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                    <button onclick="sendAction()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition shadow">执行</button>
                </div>
            </footer>
        </section>
    </main>

    <!-- 背包弹窗 -->
    <div id="backpack-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-amber-400 text-base">📦 随身背包与战利品管理</h3>
                <button onclick="toggleBackpack()" class="text-slate-400 text-sm hover:text-white font-bold">✕ 关闭</button>
            </div>
            <div id="backpack-content" class="space-y-3 text-sm text-slate-200 max-h-96 overflow-y-auto mb-3 pr-1"></div>
        </div>
    </div>

    <script>
        // 游戏核心状态数据结构
        let player = {
            id: "（主人）",
            gender: "男",
            faction: "东方修仙",
            moral: "黄名侠士",
            levelNum: 1,
            level: "Lv.1 练气初期",
            money: 100,
            hp: 100, maxHp: 100,
            mp: 50, maxMp: 50,
            ap: 10, maxAp: 10,
            pills: ["下品聚气丹 x1"], // 限制最多3枚（炼药师可提升）
            pillLimit: 3,
            inventory: ["新手铁剑(未绑定) x1", "粗布衣 x1"],
            equipment: {
                weapon: "新手铁剑(未绑定)",
                armor: "粗布衣",
                pants: "粗布裤鞋",
                rings: ["无", "无", "无"]
            },
            jobs: [] // 18级、36级、50级解锁
        };

        let chatHistory = [];

        // 页面加载时尝试读取本地存档
        window.onload = function() {
            const saved = localStorage.getItem("xiuxian_save_v2");
            if (saved) {
                try {
                    player = JSON.parse(saved);
                    updateUI();
                    appendLog("系统提示", "检测到本地已有存档，已成功读取您的修仙进度！");
                } catch(e) { console.error("读取存档失败", e); }
            }
        };

        function saveGame() {
            localStorage.setItem("xiuxian_save_v2", JSON.stringify(player));
            alert("💾 游戏进度已成功存入本地浏览器！");
        }

        function updateUI() {
            document.getElementById("ui-id").innerText = player.id;
            document.getElementById("ui-faction").innerText = player.faction;
            document.getElementById("ui-moral").innerText = player.moral;
            document.getElementById("ui-level").innerText = player.level;
            document.getElementById("ui-money").innerText = player.money + "两";
            document.getElementById("ui-hp").innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById("ui-blue").innerText = `${player.mp}/${player.maxMp}`;
            document.getElementById("ui-ap").innerText = `${player.ap}/${player.maxAp}`;
            
            // 丹药上限显示
            document.getElementById("pill-count-badge").innerText = `${player.pills.length}/${player.pillLimit}`;
            
            document.getElementById("hp-bar").style.width = Math.max(0, Math.min(100, (player.hp / player.maxHp * 100))) + "%";
            document.getElementById("mp-bar").style.width = Math.max(0, Math.min(100, (player.mp / player.maxMp * 100))) + "%";
            document.getElementById("ap-bar").style.width = Math.max(0, Math.min(100, (player.ap / player.maxAp * 100))) + "%";

            // 装备栏更新
            document.getElementById("eq-weapon").innerText = player.equipment.weapon;
            document.getElementById("eq-armor").innerText = player.equipment.armor;
            document.getElementById("eq-pants").innerText = player.equipment.pants;
            document.getElementById("eq-ring").innerText = player.equipment.rings.join(" / ");
            document.getElementById("ui-jobs").innerText = player.jobs.length > 0 ? player.jobs.join(", ") : "无 (18级解锁)";
        }

        function appendLog(sender, text, imageUrl = null) {
            const box = document.getElementById("story-box");
            let imgHtml = imageUrl ? `<div class="mt-3 rounded-lg overflow-hidden border border-slate-700 shadow-lg"><img src="${imageUrl}" class="w-full h-auto object-cover max-h-80"></div>` : "";
            box.innerHTML += `<div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow"><span class="text-amber-400 font-bold text-sm block mb-1">${sender}：</span><span class="text-slate-100 text-base leading-relaxed">${text}</span>${imgHtml}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function toggleBackpack() {
            const modal = document.getElementById("backpack-modal");
            modal.classList.toggle("hidden");
            const content = document.getElementById("backpack-content");
            
            let html = `<div class="text-amber-300 font-bold mb-1">【随身回复丹药（上限 ${player.pillLimit} 枚）】</div>`;
            if (player.pills.length === 0) {
                html += `<div class="text-slate-500 text-xs mb-2">暂无回复丹药</div>`;
            } else {
                player.pills.forEach((p, idx) => {
                    html += `<div class="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center text-xs mb-1"><span>💊 ${p}</span><button onclick="usePill(${idx})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded">使用</button></div>`;
                });
            }

            html += `<div class="text-cyan-300 font-bold mt-3 mb-1">【其他装备 / 稀有材料 / 卷轴 / 宝藏】</div>`;
            if (player.inventory.length === 0) {
                html += `<div class="text-slate-500 text-xs">空空如也</div>`;
            } else {
                player.inventory.forEach((i, idx) => {
                    html += `<div class="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center text-xs mb-1"><span>🎁 ${i}</span><button onclick="useItem(${idx})" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded">装备/查看</button></div>`;
                });
            }
            content.innerHTML = html;
        }

        function usePill(idx) {
            let pill = player.pills.splice(idx, 1)[0];
            player.hp = Math.min(player.maxHp, player.hp + 50);
            player.mp = Math.min(player.maxMp, player.mp + 30);
            updateUI();
            toggleBackpack();
            appendLog("系统提示", `你服用了【${pill}】，气血与真气得到恢复！`);
        }

        function useItem(idx) {
            let item = player.inventory.splice(idx, 1)[0];
            appendLog("系统提示", `你查看并处理了战利品：【${item}】。`);
            updateUI();
            toggleBackpack();
        }

        function openCharacterCreation() {
            let nameInput = prompt("【创角系统】请输入你的专属角色ID（身份证绑定制）：", "（主人）");
            if (!nameInput) return;
            let genderInput = prompt("请选择性别（男/女）：", "男");
            let factionInput = prompt("请选择阵营（1. 东方修仙  2. 西方魔法）：", "1");

            player.id = nameInput.trim();
            player.gender = genderInput.trim() || "男";
            player.faction = factionInput.includes("2") ? "西方魔法" : "东方修仙";
            
            updateUI();
            document.getElementById("player-avatar").src = `https://api.dicebear.com/8.x/notionists-neutral/svg?seed=${player.id}`;

            const initPrompt = `玩家ID【${player.id}】（${player.gender}），选择了【${player.faction}】阵营，正式降生于新手村【青云镇】。请为我描绘降生初期的壮丽全景、周遭环境、初始奇遇，并附带一张符合场景的精美动漫插图提示。结尾必须严格给出A、B、C、D四个不同的后续行动选项。`;
            callGemini(initPrompt, `我创建了角色【${player.id}】，阵营：${player.faction}`);
        }

        async function callGemini(promptText, displayPrompt = null) {
            const apiKey = document.getElementById("apiKey").value.trim();
            if (!apiKey) {
                alert("请先在右上角填入你的 Gemini API Key！");
                return;
            }

            if (displayPrompt) {
                appendLog("你", displayPrompt);
            } else {
                appendLog("你", promptText);
            }
            chatHistory.push({ role: "user", parts: [{ text: promptText }] });

            appendLog("世界主脑", "天道推演、奇遇演算与AI绘图构思中...");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "你是仙魔异世录的硬核DM主脑。完全遵循玩家设定的规则：严格展现惊险刺激、拳拳到肉的战斗描写（HP、MP、真气耗尽限制、生死一线）、动态副职业觉醒（18级、36级、50级）、装备唯一ID绑定、死亡掉落70%概率、智能补给与丹药上限（默认3枚）。每轮回复必须在最末尾严格提供4个不同的后续选项，分别以 A. B. C. D. 开头。并且请在回复中自然穿插图片描述或通过随机图床展示一个精美场景插图URL（格式形如 [IMAGE:https://img.paulzzh.com/touhou/random?v=xxx]）。" }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let reply = data.candidates[0].content.parts[0].text;
                
                // 移除“推演中”提示
                const box = document.getElementById("story-box");
                box.lastChild.remove();

                // 提取图片
                let imageUrl = null;
                const imgMatch = reply.match(/\[IMAGE:(.*?)\]/);
                if (imgMatch) {
                    imageUrl = imgMatch[1];
                    reply = reply.replace(imgMatch[0], "");
                } else {
                    imageUrl = "https://img.paulzzh.com/touhou/random?v=" + Math.random();
                }

                // 提取 A B C D 选项
                let options = [];
                let cleanReply = reply;
                const optionRegex = /([A-D]\.\s*[^\n]+)/g;
                let matches = reply.match(optionRegex);
                if (matches && matches.length >= 2) {
                    options = matches.slice(0, 4);
                    let splitIndex = reply.search(/[A-D]\.\s/);
                    if (splitIndex !== -1) {
                        cleanReply = reply.substring(0, splitIndex).trim();
                    }
                }

                appendLog("世界主脑", cleanReply, imageUrl);
                chatHistory.push({ role: "model", parts: [{ text: reply }] });

                renderDynamicChoices(options);

            } catch (err) {
                console.error(err);
                const box = document.getElementById("story-box");
                if (box.lastChild) box.lastChild.remove();
                appendLog("系统错误", "调用 Gemini API 失败: " + err.message);
            }
        }

        function sendAction() {
            const input = document.getElementById("custom-input");
            const val = input.value.trim();
            if (!val) return;
            if (val === "打开背包") {
                toggleBackpack();
                input.value = "";
                return;
            }
            input.value = "";
            callGemini(val);
        }

        function renderDynamicChoices(options) {
            const container = document.getElementById("choices-container");
            if (!options || options.length === 0) {
                container.innerHTML = `
                    <button onclick="callGemini('A. 深入青云山脉外围，寻找妖兽与地下城遗迹')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 p-3 rounded-xl text-left text-sm font-bold transition shadow">A. 深入青云山脉外围，寻找妖兽与地下城遗迹</button>
                    <button onclick="callGemini('B. 前往城镇公会接取悬赏任务与查看在线路人')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 p-3 rounded-xl text-left text-sm font-bold transition shadow">B. 前往城镇公会接取悬赏任务与查看在线路人</button>
                    <button onclick="callGemini('C. 前往客栈住店歇息并打坐调息恢复真气')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-300 p-3 rounded-xl text-left text-sm font-bold transition shadow">C. 前往客栈住店歇息并打坐调息恢复真气</button>
                    <button onclick="callGemini('D. 前往坊市拍卖行查看全服ID绑定神兵与副职业卷轴')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-purple-300 p-3 rounded-xl text-left text-sm font-bold transition shadow">D. 前往坊市拍卖行查看全服ID绑定神兵与副职业卷轴</button>
                `;
                return;
            }

            let html = "";
            options.forEach(opt => {
                let cleanOpt = opt.replace(/"/g, '&quot;');
                html += `<button onclick="callGemini('${cleanOpt}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 p-3 rounded-xl text-left text-sm font-bold transition shadow">${cleanOpt}</button>`;
            });
            container.innerHTML = html;
        }

        updateUI();
    </script>
</body>
</html>
